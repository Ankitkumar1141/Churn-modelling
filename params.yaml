Data_Preparation:
  test_size: 0.25
  random_state: 42

Data_Preprocessing:
  target: churned
  n_neighbors: 10
  random_state: 42

Train:
  XGBoost:
    n_estimators: 271
    max_depth: 8
    learning_rate: 0.0253
    subsample: 0.8117
    colsample_bytree: 0.5525
    min_child_weight: 3
    gamma: 4.8089
    reg_alpha: 0.0068
    random_state: 42
    n_jobs: -1
    verbosity: 0
    eval_metric: logloss