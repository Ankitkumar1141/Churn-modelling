stages:
  data_cleaning:
    cmd: python src/data/data_cleaning.py
    deps: [src/data/data_cleaning.py, data/raw_xlsx/raw_data.xlsx]
    outs: [data/raw/raw_data.csv, data/cleaned/churn_cleaned.csv]

  data_preparation:
    cmd: python src/data/data_preparation.py
    deps: [src/data/data_preparation.py, data/cleaned/churn_cleaned.csv]
    params: [Data_Preparation]
    outs: [data/interim]

  data_preprocessing:
    cmd: python src/features/data_preprocessing.py
    deps: [src/features/data_preprocessing.py, data/interim]
    params: [Data_Preprocessing]
    outs: [data/class_balance, data/processed, models/preprocessor.joblib]

  train:
    cmd: python src/models/train.py
    deps: [src/models/train.py, data/processed/train.csv]
    params: [Train]
    outs: [models/model.joblib]

  evaluation:
    cmd: python src/models/evaluation.py
    deps: [src/models/evaluation.py, models/model.joblib, models/preprocessor.joblib, data/processed]
    outs: [run_information.json]

  register_model:
    cmd: python src/models/register_model.py
    deps: [src/models/register_model.py, run_information.json]